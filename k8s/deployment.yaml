apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-api
  namespace: mlops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction-api
  template:
    metadata:
      labels:
        app: prediction-api
    spec:
      containers:
        - name: api
          image: ghcr.io/suhanapatel24/mlops-prediction-platform:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-api
  namespace: mlops-platform
spec:
  type: LoadBalancer
  selector:
    app: prediction-api
  ports:
    - port: 80
      targetPort: 8080
